[package]
name = "wrkflw-wasm"
version = "0.7.3"
edition = "2021"
description = "WebAssembly bindings for wrkflw validation and matrix expansion"
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal crates
wrkflw-models = { path = "../models" }
wrkflw-validators = { path = "../validators", default-features = false }
wrkflw-matrix = { path = "../matrix" }

# Wasm dependencies
wasm-bindgen = "0.2.106"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

# Shared dependencies (must be wasm-compatible)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
